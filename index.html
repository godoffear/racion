<style>
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --ink:#16241F; --muted:#5C6C65; --line:#D3DCD5;
  --accent:#1E6B55; --accent-ink:#FFFFFF; --now:#F2B632; --now-ink:#2A1E00;
  --p:#1E6B55; --f:#C98E12; --c:#4A73B0; --warn:#B4432F;
  --r-lg:18px; --r-sm:10px;
  --ui:'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --display:'Unbounded', 'Onest', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211D; --sunk:#1D2A25; --ink:#E4EDE8; --muted:#93A49C; --line:#2A3833;
    --accent:#5BBE99; --accent-ink:#06170F; --p:#5BBE99; --f:#E2AE3C; --c:#7FA3DA; --warn:#E07A63;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --sunk:#1D2A25; --ink:#E4EDE8; --muted:#93A49C; --line:#2A3833;
  --accent:#5BBE99; --accent-ink:#06170F; --p:#5BBE99; --f:#E2AE3C; --c:#7FA3DA; --warn:#E07A63;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--ui);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--now);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{margin:0;font-weight:600}
h2{font-size:1.1rem;margin:22px 0 10px}
.muted{color:var(--muted)} .small{font-size:.86rem} .flag{color:var(--warn);font-weight:600}
.top{margin:6px 0 14px}
.top h1{font:700 1.35rem/1.1 var(--display);letter-spacing:-.01em}
.top .date{color:var(--muted);font-size:.9rem;margin-top:4px;line-height:1.35}
.weeknav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.weeknav .lbl{flex:1;text-align:center;font-size:.85rem;color:var(--muted)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.05rem;flex:none}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.strip button b{font-weight:600;font-size:.95rem}
.strip button span{font-size:.72rem;color:var(--muted)}
.strip button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip button.sel span{color:inherit;opacity:.75}
.strip button.today:not(.sel){border-color:var(--accent);border-width:2px}
.hero{background:var(--now);color:var(--now-ink);border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:14px}
.hero .hh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .when{font:700 clamp(2.2rem,11vw,2.9rem)/1 var(--display);letter-spacing:-.03em}
.hero .hh .what{margin:0;font-size:1.15rem}
.hero .rtag{color:inherit;opacity:.75}
.howd{margin-top:8px;font-size:.9rem}
.howd>summary{cursor:pointer;font-weight:600;list-style:none;opacity:.8}
.howd>summary::-webkit-details-marker{display:none}
.howd>summary::after{content:' ▸'}
.howd[open]>summary::after{content:' ▾'}
.hero .what{font-weight:600;font-size:1.1rem;margin-top:6px}
.hero .items{margin-top:4px}
.hero .how{margin-top:6px;font-size:.9rem;opacity:.85}
.hero .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.hero .eta{font-size:.9rem;opacity:.85}
.hero .btn{background:var(--now-ink);color:var(--now);border:0}
.card{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px}
.card h3{font-size:1rem;margin-bottom:4px}
.card ul.tasks{margin:6px 0 0;padding-left:18px}
.card ul.tasks li{margin:3px 0}
.due{border-left:4px solid var(--now)}
.prep{border-left:4px solid var(--c)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.mh .t{font:600 .95rem/1.3 var(--ui);font-variant-numeric:tabular-nums}
.mh .name{font-weight:600;flex:1}
.steps{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:.84rem}
.steps li{margin:2px 0}
.hero .steps{color:inherit;opacity:.85}
.eaten .steps,.eaten .chips{opacity:.55}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:.95rem;text-decoration:none;display:inline-block}
.btn.sm{padding:7px 12px;font-size:.85rem;flex:none}
.list .nm{overflow-wrap:anywhere}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.tl>li{position:relative;padding:0 0 18px 16px}
.tl>li::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tl>li.eaten::before{background:var(--accent);border-color:var(--accent)}
.tl>li.next::before{background:var(--now);border-color:var(--now)}
.meal{display:flex;gap:12px;align-items:flex-start}
.meal .t{font:600 .95rem/1.4 var(--ui);font-variant-numeric:tabular-nums;min-width:44px}
.meal .body{flex:1;min-width:0}
.meal .name{font-weight:600}
.meal .items{font-size:.95rem}
.meal .how{color:var(--muted);font-size:.85rem;margin-top:2px}
.eaten .meal .items,.eaten .meal .how{opacity:.55}
.chips{display:flex;gap:8px;margin-top:3px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.chips .p{color:var(--p)} .chips .f{color:var(--f)} .chips .c{color:var(--c)}
.check{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1rem}
.eaten .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.walk{margin:0 0 16px 24px;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunk);font-size:.9rem}
.daytot{font-size:.88rem;color:var(--muted);margin:4px 0 12px}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .nm{font-weight:500}
.list .sub{font-size:.82rem;color:var(--muted)}
.list>li.bought .nm{text-decoration:line-through;color:var(--muted)}
.cb{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;font-size:.9rem}
.cb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat{font-size:.82rem;color:var(--muted);margin:14px 0 2px;font-weight:600}
.cat:first-child{margin-top:0}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700}
.qty b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.tog{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.tog button{border:0;background:var(--bg);padding:6px 10px;font-size:.82rem}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.h2row .link{font-size:.85rem}
.gin{width:88px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--bg);font-variant-numeric:tabular-nums}
.tog button.on{background:var(--ink);color:var(--bg);font-weight:600}
.buy .tog button.on.b{background:var(--warn);color:#fff}
details.card summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary b::before{content:"▸ ";color:var(--muted)}
details.card[open] summary b::before{content:"▾ "}
details.card[open] summary{margin-bottom:8px}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--accent)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);min-width:0}
.big2{font:700 1.8rem/1.25 var(--display);letter-spacing:-.02em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.big2 span{font:500 .95rem var(--ui);color:var(--muted);letter-spacing:0}
.spark{width:100%;height:auto;display:block;margin:10px 0 2px}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.spark .pt{fill:var(--accent)}
.spark .tg{stroke:var(--now);stroke-width:2;stroke-dasharray:6 5}
.spk{display:flex;justify-content:space-between}
.il{list-style:none;margin:4px 0 0;padding:0}
.il li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-top:1px dashed var(--line);font-size:.95rem}
.il li:first-child{border-top:0}
.il li span{min-width:0}
.il li i{font-style:normal;color:var(--muted);font-size:.8em}
.il li b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.il.sm li{font-size:.85rem}
.task{margin:4px 0;font-size:.88rem}
.notes{list-style:none;margin:3px 0 0;padding:0;font-size:.8rem;color:var(--muted)}
.notes li{position:relative;padding-left:12px;margin:1px 0}
.notes li::before{content:'·';position:absolute;left:2px;font-weight:700}
.srow{align-items:flex-start!important}
.srow .cb{margin-top:2px}
.rt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rt .nm{font-weight:600;min-width:0}
.rt .q{white-space:nowrap;font-variant-numeric:tabular-nums}
.srow .il{margin-top:4px}
.brow{display:block!important}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bh .nm{font-weight:600}
.lrow .qty b{min-width:30px}
.hero .il li{border-top-color:rgba(42,30,0,.25)}
.eaten .il{opacity:.55}
.card ul.tasks .il{margin-top:4px}
.card ul.tasks .il li{font-size:.86rem}
.mact{font-size:.85rem;margin:6px 0 0}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.85rem}
.pick small{color:var(--muted)}
.tl>li.extra::before{background:var(--f);border-color:var(--f);border-radius:4px}
.btn.wide{display:block;width:100%;text-align:center;margin:0 0 12px;border-style:dashed;background:transparent}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;min-width:0}
.field label{font-size:.78rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:var(--bg);width:100%;min-width:0;font:inherit;font-size:.92rem}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.g5 input{text-align:center;padding:8px 4px}
.pick.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick.off{background:var(--warn);color:#fff;border-color:var(--warn)}
.pick.all{font-weight:600}
.sum .sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.sum .sg b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.sum .sg span{font-size:.7rem;color:var(--muted);line-height:1.2;display:block}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:70px;align-items:end;margin:4px 0 8px}
.bc{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:2px}
.bc i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:3px}
.bc span{font-size:.68rem;color:var(--muted)}
.skipx{flex:none;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:.8rem;opacity:.6}
.skipx[aria-pressed="true"]{opacity:1;background:var(--sunk);color:var(--warn)}
.hero .hb{display:flex;align-items:center;gap:8px}
.hero .hx{color:var(--now-ink);opacity:.55}
.tl>li.skipped .il,.tl>li.skipped .steps,.tl>li.skipped .chips{opacity:.35;text-decoration:line-through}
.tl>li.skipped::before{background:var(--sunk);border-style:dashed}
.mh .name small{font-weight:400;color:var(--warn);font-size:.75rem}
.edbox{background:var(--sunk);border-radius:var(--r-sm);padding:6px 10px 10px;margin:6px 0}
.edbox .list>li{border-top-color:var(--line)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0 4px}
.seg3 button{border:0;background:var(--surface);padding:8px 4px;font-size:.85rem}
.seg3 button.on{background:var(--ink);color:var(--bg);font-weight:600}
.kc{font-size:.8rem;color:var(--f);font-weight:600;white-space:nowrap}
.srow .btn.sm{align-self:center}
.seg{display:grid;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:0 0 12px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:0;background:var(--surface);padding:9px 6px;font-size:.9rem}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.mlist .link{font-size:.82rem;margin-left:50px}
details:not(.card)>summary{cursor:pointer;list-style:none}
details:not(.card)>summary::-webkit-details-marker{display:none}
details:not(.card)>summary::before{content:'▸ '}
details:not(.card)[open]>summary::before{content:'▾ '}
.mh .name{min-width:0;overflow-wrap:anywhere}
.nlink{background:none;border:0;padding:0;text-align:left;font:inherit;font-weight:600;color:inherit}
.mh .nlink small{font-weight:400;color:var(--muted)}
.tl>li.mini{padding-bottom:10px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.streak{font-size:.82rem;font-weight:600;margin-top:4px;color:var(--f)}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring .rb{fill:none;stroke:var(--sunk);stroke-width:6}

// замена белка — всегда по количеству белка (тофу вместо курицы — больше граммов), граммы ↔ банки тоже
function swapQ(from,q,to){const a=PR[from],b=PR[to];if(!a||!b||from===to)return q;if(a.u==='г'&&b.u==='г')return Math.min(q*2,Math.max(10,Math.round(q*a.p/b.p/10)*10));if(a.u===b.u)return q;const pr=a.p*(a.u==='шт'?q*a.pg:q)/100;
  return b.u==="шт"?Math.max(1,Math.round(pr/(b.p*b.pg/100)+0.2)):Math.max(10,Math.round(pr/b.p*100/10)*10)}
// «из дома в меню»: чем можно заменить продукт в приёме, чтобы съесть остатки
const UVEG=['broccoli','cabbage','carrot','greens','beans','bokchoy','bellpep','mushroom','tomato','pumpkin','zucchini'],UFRUIT=['apple','banana','orange','mango','papaya','pineapple','dragon','watermelon','jackfruit','roseapple'],UCARB=['rice','ricenoodle','glassnoodle','eggnoodle','potato','sweet','bread','corn','corncan'];
function useClass(id){return SWAPP.includes(id)?'prot':UVEG.includes(id)||id==='veg'?'veg':UFRUIT.includes(id)?'fruit':UCARB.includes(id)?'carb':null}
// белок — по белку, овощи — те же граммы, фрукты и гарниры — по калориям
function convQ(from,q,to){const c=useClass(from),a=PR[from],b=PR[to];if(c==='prot')return swapQ(from,q,to);if(c==='veg'&&a.u==='г'&&b.u==='г')return q;
  const kc=a.k*(a.u==='шт'?q*a.pg:q)/100;return b.u==='шт'?Math.max(1,Math.round(kc/(b.k*b.pg/100))):Math.max(10,Math.round(kc/b.k*100/10)*10)}

function appNow(){const d=new Date();if(d.getHours()<2){const y=new Date(d);y.setDate(y.getDate()-1);if(dkey(y)>='2026-10-11')return d;let m=false;try{const k=dkey(y)+'|late';m=!!((S.done||{})[k]||(S.skip||{})[k])}catch(_){}if(!m)return y}return d}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pkey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function wd(d){return (d.getDay()+6)%7}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function fmtDate(d){return d.getDate()+' '+MONTHS[d.getMonth()]}
function tmin(t){const [h,m]=t.split(':').map(Number);return (h<4?h+24:h)*60+m}
function nowMin(){const d=new Date();return (d.getHours()<2?d.getHours()+24:d.getHours())*60+d.getMinutes()}
function cycleStart(d){return addDays(d,-((wd(d)-1+7)%7))} // ближайший вторник назад
function menuName(cs){const i=menuIdxOf(cs);return i<0?'базовое меню':'меню '+(i+1)+' из 4'}
function cycleIdx(cs){const n=Math.round((cs-EPOCH)/864e5/7);return ((n%4)+4)%4}
function rawDay(date){const cs=cycleStart(date),ck=dkey(cs),di=Math.round((date-cs)/864e5),wm=(S.wmenu||{})[ck];
  return (wm!=null?(cs<EPOCH?OLD_WEEKS:WEEKS)[wm]:cs<EPOCH?LEGACY:WEEKS[cycleIdx(cs)])[di]}
function menuIdxOf(cs){const wm=(S.wmenu||{})[dkey(cs)];return wm!=null?wm:cs<EPOCH?-1:cycleIdx(cs)}
const ovItems=a=>a.filter(Array.isArray),ovDish=a=>typeof a[a.length-1]==='string'?a[a.length-1]:null;
function dayPlan(date){
  const cs=cycleStart(date),raw=rawDay(date),type=raw[0];
  const ov=OVERRIDES[dkey(date)]||{},dk=dkey(date),ww=(S.wswaps||{})[dkey(cs)]||{};
  return {type,meals:raw[1].map(([slot,items,dsh])=>{const k=dk+'|'+slot,sw=(S.swaps||{})[k],ds=(S.dswap||{})[k];
    let src=ov[slot]?ovItems(ov[slot]):items,dish=ov[slot]?ovDish(ov[slot]):dsh;if(ds){const r2=rawDay(pkey(ds)),m2=r2&&r2[1].find(x=>x[0]===slot),o2=(OVERRIDES[ds]||{})[slot];if(m2){src=o2?ovItems(o2):m2[1];dish=o2?ovDish(o2):m2[2]}}
    let its=src.filter(([p,q])=>q>0).map(([p,q])=>({p,q}));
    let wsw=null;
    its=its.map(i=>{const to=ww[i.p];if(to){wsw={from:i.p,to};return {p:to,q:convQ(i.p,i.q,to)}}return i});
    if(sw&&its.some(i=>i.p===sw.from))its=its.map(i=>i.p===sw.from?{p:sw.to,q:swapQ(i.p,i.q,sw.to)}:i);
    const hu=(S.huse||{})[k];let huc=false;if(hu)its=its.map(i=>{const to=hu[i.p];if(!to||!PR[to])return i;if(['prot','carb'].includes(useClass(i.p)))huc=true;return {p:to,q:convQ(i.p,i.q,to)}});
    const rc=(S.rec||{})[k];if(rc&&RECBY[rc])its=RECBY[rc][3].map(([p,q])=>({p,q}));
    const ed=(S.edits||{})[k];if(ed)its=ed.map(([p,q])=>({p,q}));
    const swp=sw&&its.some(i=>i.p===sw.to)?sw:null;if(swp||wsw||huc||!RECBY[dish])dish=null; // при замене белка шаги блюда уже не подходят
    return {slot,time:slot==='bf'?TIMES['bf_'+type]:TIMES[slot],items:its,swap:swp,wswap:wsw,edited:!!ed,rec:rc&&RECBY[rc]?rc:null,dish,huse:!!hu,meth:(S.meth||{})[k]||null,dswap:ds||null}})};
