<html lang="ru">
<head>

<style>
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --ink:#16241F; --muted:#5C6C65; --line:#D3DCD5;
  --accent:#1E6B55; --accent-ink:#FFFFFF; --now:#F2B632; --now-ink:#2A1E00;
  --p:#1E6B55; --f:#C98E12; --c:#4A73B0; --warn:#B4432F;
  --r-lg:18px; --r-sm:10px;
  --ui:'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --display:'Unbounded', 'Onest', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211D; --sunk:#1D2A25; --ink:#E4EDE8; --muted:#93A49C; --line:#2A3833;
    --accent:#5BBE99; --accent-ink:#06170F; --p:#5BBE99; --f:#E2AE3C; --c:#7FA3DA; --warn:#E07A63;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --sunk:#1D2A25; --ink:#E4EDE8; --muted:#93A49C; --line:#2A3833;
  --accent:#5BBE99; --accent-ink:#06170F; --p:#5BBE99; --f:#E2AE3C; --c:#7FA3DA; --warn:#E07A63;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--ui);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--now);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{margin:0;font-weight:600}
h2{font-size:1.1rem;margin:22px 0 10px}
.muted{color:var(--muted)} .small{font-size:.86rem} .flag{color:var(--warn);font-weight:600}
.top{margin:6px 0 14px}
.top h1{font:700 1.35rem/1.1 var(--display);letter-spacing:-.01em}
.top .date{color:var(--muted);font-size:.9rem;margin-top:4px;line-height:1.35}
.weeknav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.weeknav .lbl{flex:1;text-align:center;font-size:.85rem;color:var(--muted)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.05rem;flex:none}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.strip button b{font-weight:600;font-size:.95rem}
.strip button span{font-size:.72rem;color:var(--muted)}
.strip button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip button.sel span{color:inherit;opacity:.75}
.strip button.today:not(.sel){border-color:var(--accent);border-width:2px}
.hero{background:var(--now);color:var(--now-ink);border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:14px}
.hero .when{font:700 clamp(3rem,16vw,4.4rem)/.95 var(--display);letter-spacing:-.04em}
.hero .what{font-weight:600;font-size:1.1rem;margin-top:6px}
.hero .items{margin-top:4px}
.hero .how{margin-top:6px;font-size:.9rem;opacity:.85}
.hero .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.hero .eta{font-size:.9rem;opacity:.85}
.hero .btn{background:var(--now-ink);color:var(--now);border:0}
.card{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px}
.card h3{font-size:1rem;margin-bottom:4px}
.card ul.tasks{margin:6px 0 0;padding-left:18px}
.card ul.tasks li{margin:3px 0}
.due{border-left:4px solid var(--now)}
.prep{border-left:4px solid var(--c)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.mh .t{font:600 .95rem/1.3 var(--ui);font-variant-numeric:tabular-nums}
.mh .name{font-weight:600;flex:1}
.steps{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:.84rem}
.steps li{margin:2px 0}
.hero .steps{color:inherit;opacity:.85}
.eaten .steps,.eaten .chips{opacity:.55}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:.95rem;text-decoration:none;display:inline-block}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.tl>li{position:relative;padding:0 0 18px 16px}
.tl>li::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tl>li.eaten::before{background:var(--accent);border-color:var(--accent)}
.tl>li.next::before{background:var(--now);border-color:var(--now)}
.meal{display:flex;gap:12px;align-items:flex-start}
.meal .t{font:600 .95rem/1.4 var(--ui);font-variant-numeric:tabular-nums;min-width:44px}
.meal .body{flex:1;min-width:0}
.meal .name{font-weight:600}
.meal .items{font-size:.95rem}
.meal .how{color:var(--muted);font-size:.85rem;margin-top:2px}
.eaten .meal .items,.eaten .meal .how{opacity:.55}
.chips{display:flex;gap:8px;margin-top:3px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.chips .p{color:var(--p)} .chips .f{color:var(--f)} .chips .c{color:var(--c)}
.check{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1rem}
.eaten .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.walk{margin:0 0 16px 24px;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunk);font-size:.9rem}
.daytot{font-size:.88rem;color:var(--muted);margin:4px 0 12px}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .nm{font-weight:500}
.list .sub{font-size:.82rem;color:var(--muted)}
.list>li.bought .nm{text-decoration:line-through;color:var(--muted)}
.cb{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;font-size:.9rem}
.cb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat{font-size:.82rem;color:var(--muted);margin:14px 0 2px;font-weight:600}
.cat:first-child{margin-top:0}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700}
.qty b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.tog{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.tog button{border:0;background:var(--bg);padding:6px 10px;font-size:.82rem}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.h2row .link{font-size:.85rem}
.gin{width:88px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--bg);font-variant-numeric:tabular-nums}
.tog button.on{background:var(--ink);color:var(--bg);font-weight:600}
.buy .tog button.on.b{background:var(--warn);color:#fff}
details.card summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary b::before{content:"▸ ";color:var(--muted)}
details.card[open] summary b::before{content:"▾ "}
details.card[open] summary{margin-bottom:8px}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--accent)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);min-width:0}
.big2{font:700 1.8rem/1.25 var(--display);letter-spacing:-.02em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.big2 span{font:500 .95rem var(--ui);color:var(--muted);letter-spacing:0}
.spark{width:100%;height:auto;display:block;margin:10px 0 2px}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.spark .pt{fill:var(--accent)}
.spark .tg{stroke:var(--now);stroke-width:2;stroke-dasharray:6 5}
.spk{display:flex;justify-content:space-between}
.il{list-style:none;margin:4px 0 0;padding:0}
.il li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-top:1px dashed var(--line);font-size:.95rem}
.il li:first-child{border-top:0}
.il li span{min-width:0}
.il li i{font-style:normal;color:var(--muted);font-size:.8em}
.il li b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.il.sm li{font-size:.85rem}
.task{margin:4px 0;font-size:.88rem}
.notes{list-style:none;margin:3px 0 0;padding:0;font-size:.8rem;color:var(--muted)}
.notes li{position:relative;padding-left:12px;margin:1px 0}
.notes li::before{content:'·';position:absolute;left:2px;font-weight:700}
.srow{align-items:flex-start!important}
.srow .cb{margin-top:2px}
.rt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rt .nm{font-weight:600;min-width:0}
.rt .q{white-space:nowrap;font-variant-numeric:tabular-nums}
.srow .il{margin-top:4px}
.brow{display:block!important}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bh .nm{font-weight:600}
.lrow .qty b{min-width:30px}
.hero .il li{border-top-color:rgba(42,30,0,.25)}
.eaten .il{opacity:.55}
.card ul.tasks .il{margin-top:4px}
.card ul.tasks .il li{font-size:.86rem}
.eatbox{padding:10px 12px}
.eatbox .eh{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;font-weight:600;margin-bottom:6px}
.eatbox .eh span{font-weight:400;color:var(--muted);font-size:.75rem}
.ng{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nt{min-width:0}
.nt>b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums;line-height:1.2}
.nt>b.over{color:var(--warn)}
.nt .nl{font-size:.72rem;color:var(--ink);white-space:nowrap}
.nt .nn{font-size:.66rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.nb{height:4px;border-radius:2px;background:var(--sunk);margin-top:4px;overflow:hidden}
.nb i{display:block;height:100%;border-radius:2px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px;font-size:.9rem}
.bar-top .btn{background:var(--bg);color:var(--ink);border:0;padding:7px 14px;font-size:.85rem;flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
nav.tabs button .ic{font-size:1.25rem;line-height:1.2}
nav.tabs button.on{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;max-width:90%;text-align:center}
</style>
</head>

/* ===== Даты ===== */
const pad=n=>String(n).padStart(2,'0');
function appNow(){const d=new Date();if(d.getHours()<4)d.setDate(d.getDate()-1);return d}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pkey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function wd(d){return (d.getDay()+6)%7}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function fmtDate(d){return d.getDate()+' '+MONTHS[d.getMonth()]}
function tmin(t){const [h,m]=t.split(':').map(Number);return (h<4?h+24:h)*60+m}
function nowMin(){const d=new Date();return (d.getHours()<4?d.getHours()+24:d.getHours())*60+d.getMinutes()}
function cycleStart(d){return addDays(d,-((wd(d)-1+7)%7))} // ближайший вторник назад
function menuName(cs){return cs<EPOCH?'базовое меню':'меню '+(cycleIdx(cs)+1)+' из 4'}
function cycleIdx(cs){const n=Math.round((cs-EPOCH)/864e5/7);return ((n%4)+4)%4}
function dayPlan(date){
  const cs=cycleStart(date),di=Math.round((date-cs)/864e5),raw=(cs<EPOCH?LEGACY:WEEKS[cycleIdx(cs)])[di],type=raw[0];
  const ov=OVERRIDES[dkey(date)]||{};
  return {type,meals:raw[1].map(([slot,items])=>({slot,time:slot==='bf'?TIMES['bf_'+type]:TIMES[slot],items:(ov[slot]||items).map(([p,q])=>({p,q}))}))};
}
function mealAt(date,m){const t=tmin(m.time);return new Date(date.getFullYear(),date.getMonth(),date.getDate(),Math.floor(t/60),t%60)}

/* ===== КБЖУ и меры ===== */
function grams(i){const p=PR[i.p];return p.u==='шт'?i.q*p.pg:i.q}
function macros(items){const t={k:0,p:0,f:0,c:0};items.forEach(i=>{const p=PR[i.p],r=grams(i)/100;t.k+=p.k*r;t.p+=p.p*r;t.f+=p.f*r;t.c+=p.c*r});return t}
const r0=Math.round;
const FR=[[0,''],[0.25,'¼'],[1/3,'⅓'],[0.5,'½'],[2/3,'⅔'],[0.75,'¾'],[1,'']];
function niceNum(x){let w=Math.floor(x+1e-9),r=x-w,best=FR[0],bd=9;FR.forEach(f=>{const d=Math.abs(r-f[0]);if(d<bd){bd=d;best=f}});
  if(bd>0.06)return {s:String(Math.round(x*10)/10).replace('.',','),int:false,n:x};
  if(best[0]===1){w++;best=FR[0]}
  if(!best[1])return {s:String(w),int:true,n:w};
  return {s:(w?w:'')+best[1],int:false,n:x}}
function plural(n,f){const a=n%10,b=n%100;if(a===1&&b!==11)return f[0];if(a>=2&&a<=4&&(b<10||b>=20))return f[1];return f[2]}
function fmtMeasure(units,key){const f=MEASURES[key],nn=niceNum(units);return nn.s+' '+(nn.int?plural(nn.n,f):f[3])}
function fq(q,u){const v=Math.round(q*10)/10;return (u==='г'&&v>=1000?String(Math.round(v/100)/10)+' кг':v+' '+u).replace('.',',')}
function qtyText(i){const p=PR[i.p];if(S.grams||!p.m){if(i.p==='rice')return i.q+' г сухого (≈ '+Math.round(i.q*2.8/10)*10+' г варёного)';return fq(i.q,p.u)}return fmtMeasure(i.q/p.mg,p.m)}

/* ===== Подсказки по готовке ===== */
function howTo(m){
  const has=id=>m.items.some(i=>i.p===id),main=m.items.find(i=>PR[i.p].how);
  if(m.slot==='pre')return ['Протеин в шейкере на воде'];
  if(m.slot==='bf')return ['Яйца варёные из запаса','Овсянку залить кипятком на 5 мин'];
  if(m.slot==='snack')return ['Протеин на воде, фрукт и орехи — готовить ничего не нужно'];
  if(m.slot==='late')return has('egg')?['Яйца варёные из запаса']:main?[PR[main.p].how]:[];
  const a=[];if(main)a.push(PR[main.p].how);
  if(has('rice'))a.push('Рис из рисоварки');
  if(has('sweet'))a.push('Батат: 20–25 мин на пару в рисоварке или в кастрюле');
  if(has('veg'))a.push(m.slot==='dinner'?'Овощи на ту же сковороду на 4–5 мин, масло в конце':'Овощи: на пару в рисоварке или 4–5 мин на сковороде');
  return a;
}
function stepsList(m){const a=howTo(m);return a.length?`<ul class="steps">${a.map(t=>`<li>${esc(t.replace(/\.$/,''))}</li>`).join('')}</ul>`:''}
const nameOf=p=>p.n.replace(/\s*\(.*\)$/,'');
// заготовки: рис на 2 дня (Вт, Чт, Сб, Пн), яйца на 3–4 дня (Вт, Пт)
function prepFor(date){
  const cs=cycleStart(date),di=Math.round((date-cs)/864e5),out=[];
  const sum=(from,to,id)=>{let t=0;for(let i=from;i<=to&&i<7;i++)dayPlan(addDays(cs,i)).meals.forEach(m=>m.items.forEach(x=>{if(x.p===id)t+=x.q}));return t};
  if(di%2===0){const r=sum(di,di+1,'rice');if(r)out.push(`Сварить рис: ${r0(r)} г сухого (≈ ${niceNum(r/150).s} мерки рисоварки), хватит на ${di===6?'сегодня':'сегодня и завтра'}. Храни в холодильнике.`)}
  if(di===0||di===3){const e=sum(di,di===0?2:6,'egg');if(e)out.push(`Сварить яйца: ${e} шт на ${di===0?'Вт–Чт':'Пт–Пн'}. В кипящую воду на 9–10 мин, потом в холодную.`)}
  return out;
}
function thawFor(date){
  const tm=addDays(date,1),twd=wd(tm);if(twd===1||twd===2)return []; // Вт и Ср — свежее с закупки
  const out=[];dayPlan(tm).meals.forEach(m=>{if(m.slot!=='lunch'&&m.slot!=='dinner')return;m.items.forEach(i=>{if(PR[i.p].how&&i.p!=='tofu')out.push({name:PR[i.p].s,q:qtyText(i),slot:SLOTS[m.slot].toLowerCase()})})});
  return out;
}

/* ===== Покупки ===== */
function shopCycle(){return addDays(cycleStart(appNow()),7)} // следующая неделя меню
function needFor(cs){const n={};for(let i=0;i<7;i++)dayPlan(addDays(cs,i)).meals.forEach(m=>m.items.forEach(x=>{n[x.p]=(n[x.p]||0)+x.q}));return n}
function useAfter(ts,until){ // сколько уйдёт по плану с момента ts до начала следующего цикла
  const u={};let d=pkey(dkey(new Date(ts)));d=addDays(d,-1);
  for(let i=0;i<10;i++){const day=addDays(d,i);if(day>=until)break;dayPlan(day).meals.forEach(m=>{const at=mealAt(day,m);if(at>ts&&at<until)m.items.forEach(x=>{u[x.p]=(u[x.p]||0)+x.q})})}
  return u}
function shopList(){
  const cs=shopCycle(),ck=dkey(cs),need=needFor(cs),L=S.left[ck]||{},rows=[];
  Object.keys(PR).forEach(id=>{const p=PR[id];if(p.bulk||!need[id])return;
    const l=L[id];let home=0;if(l&&l.q>0){const u=useAfter(l.at,cs)[id]||0;home=Math.max(0,l.q-u)}
    const lack=need[id]-home,buy=lack>0?Math.ceil(Math.round(lack*10)/10/p.shop)*p.shop:0;
    rows.push({id,p,need:need[id],home,buy})});
  const bulk=BULK.filter(id=>(S.bulk[ck]||{})[id]);
  return {cs,ck,rows,bulk,need};
}
function buyText(r){const p=r.p;if(p.m==='palm'&&!S.grams)return fq(r.buy,'г')+' ≈ '+fmtMeasure(r.buy/p.mg,'palm');if(p.u==='шт'&&r.p.shop===10)return r.buy+' шт ('+r.buy/10+' '+plural(r.buy/10,['десяток','десятка','десятков'])+')';return fq(r.buy,p.u)}
function leftStep(p){return p.m?p.mg*(p.m==='palm'?0.5:1):1}
function leftText(p,q){return p.m&&!S.grams?fmtMeasure(q/p.mg,p.m):fq(q,p.u)}
function gcal(title,dayIdx,time,details){
  const [h,mi]=time.split(':').map(Number),t=new Date();let s=null;
  for(let i=0;i<8&&!s;i++){const d=addDays(t,i);if(wd(d)===dayIdx){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,mi);if(x>t)s=x}}

});
document.addEventListener('toggle',e=>{if(e.target.id==='leftbox')window._openLeft=e.target.open;if(e.target.id==='bulkbox')window._openBulk=e.target.open},true);
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.in==='leftg'){const ck=dkey(shopCycle()),L=S.left[ck]=S.left[ck]||{},q=Math.max(0,Math.round(parseNum(el.value)));if(q>0)L[el.dataset.p]={q,at:Date.now()};else delete L[el.dataset.p];window._openLeft=true;clean();save();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='w-in'){A.wsave();render()}});

/* ===== Офлайн и обновления ===== */
async function checkUpdate(manual){
  if(!navigator.onLine){if(manual)toast('Нет интернета');return}
  try{const r=await fetch('index.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const m=(await r.text()).match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION){updReady=true;render();if(manual)toast('Есть версия '+m[1])}else if(manual)toast('У тебя последняя версия')}catch(_){if(manual)toast('Не получилось проверить')}
}
async function doUpdate(){
  try{const r=await fetch('index.html?v='+Date.now(),{cache:'no-store'});if(r.ok&&window.caches){for(const k of await caches.keys()){const c=await caches.open(k);await c.put(new URL('index.html',location.href).href,r.clone())}}}catch(_){}
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(_){}
  location.reload();
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(tab==='today')viewDate=dkey(appNow());if(!document.activeElement.matches('input'))render()}});
setInterval(()=>{if(tab==='today'&&!document.activeElement.matches('input'))render()},60000);
setTimeout(()=>checkUpdate(false),2000);
render();

</script>
